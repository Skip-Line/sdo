---
- name: Get latest Firedancer version
  uri:
    url: "https://api.github.com/repos/firedancer-io/firedancer/releases?per_page=10"
    return_content: true
  register: firedancer_version_response

- set_fact:
    firedancer_version_auto: >-
      {{
        (firedancer_version_response.json
          | selectattr('name', 'search', group_names[0], ignorecase=True)
          | map(attribute='tag_name')
          | list | first)
      }}

- name: Prompt to confirm or override Firedancer version
  pause:
    prompt: "Selected Firedancer version is {{ firedancer_version_auto }}. Press Enter to accept or type an alternative tag:"
  register: firedancer_version_prompt

- name: Use user-provided Firedancer version when supplied
  set_fact:
    firedancer_version: "{{ firedancer_version_prompt.user_input if (firedancer_version_prompt.user_input | default('')) != '' else firedancer_version_auto }}"

- name: Show final Firedancer version
  debug:
    msg: "Using Firedancer version {{ firedancer_version }}"