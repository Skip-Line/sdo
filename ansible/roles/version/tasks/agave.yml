- name: Get latest Agave version
  uri:
    url: "https://api.github.com/repos/anza-xyz/agave/releases?per_page=10"
    return_content: true
  register: agave_version_response

- set_fact:
    agave_version_auto: >-
      {{ 
      
        (agave_version_response.json 
          | selectattr('name', 'search', group_names[0], ignorecase=True)
          | map(attribute='tag_name')
          | list | first)
              
      }}

- name: Prompt to confirm or override Agave version
  pause:
    prompt: "Selected Agave version is {{ agave_version_auto }}. Press Enter to accept or type an alternative tag:"
  register: agave_version_prompt

- name: Use user-provided Agave version when supplied
  set_fact:
    agave_version: "{{ agave_version_prompt.user_input if (agave_version_prompt.user_input | default('')) != '' else agave_version_auto }}"

- name: Show final Agave version
  debug:
    msg: "Using Agave version {{ agave_version }}"